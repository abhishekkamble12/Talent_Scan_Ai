services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: talentscan-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - AIOPS_DB_PATH=/app/data/aiops_metrics.db
    volumes:
      - ./chroma:/app/chroma
      - ./uploads:/app/uploads
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000
    container_name: talentscan-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
